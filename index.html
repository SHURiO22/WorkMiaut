<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>workmiaout</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141414">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f6f4;--card:#fff;--tx:#1a1a1a;--mut:#6b6b6b;--ac:#1d6fe0;--bd:#e2e2de;--ok:#1f9d55;--red:#d94141;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141414;--card:#1e1e1e;--tx:#f0f0ee;--mut:#9a9a96;--ac:#5b9dff;--bd:#333;--ok:#3ecf7a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141414;--card:#1e1e1e;--tx:#f0f0ee;--mut:#9a9a96;--ac:#5b9dff;--bd:#333;--ok:#3ecf7a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0 auto;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;padding:14px 14px 90px;max-width:560px}
h1{font-size:19px;margin:2px 0 10px}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;min-width:52px;text-align:center;padding:7px 12px;border:1px solid var(--bd);background:var(--card);border-radius:10px;font-size:14px;font-weight:600;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tab.plus{color:var(--ac);font-size:18px;padding:3px 14px}
.tab.arm{background:var(--red);border-color:var(--red);color:#fff}
.trow{display:flex;align-items:center;gap:8px;margin:4px 0}
.title{flex:1;font-size:17px;font-weight:700}
.dn{font-weight:700}
.ti,.ni,.si{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font-size:16px;min-width:0}
.ti,.ni{flex:1}
.si{width:92px;flex:none}
.ib{flex:none;width:36px;height:36px;border:1px solid var(--bd);background:transparent;color:var(--tx);border-radius:8px;font-size:16px;padding:0}
.prog{color:var(--mut);font-size:14px;margin:2px 0 6px}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;background:var(--ok);transition:width .2s}
.row{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-bottom:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.row.sel{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac)}
.top{display:flex;align-items:center;gap:10px}
.bot{display:flex;align-items:center;justify-content:space-between;margin-top:8px;padding-left:36px}
input[type=checkbox]{width:26px;height:26px;accent-color:var(--ok);flex:none;margin:0}
.xb{width:34px;height:34px;flex:none;border:1px solid var(--bd);background:transparent;color:var(--mut);border-radius:8px;font-size:15px;padding:0}
.xb.on{background:var(--red);border-color:var(--red);color:#fff}
.n{flex:1;font-size:16px}
.s{font-weight:700;color:var(--ac)}
.w{width:84px;padding:8px 6px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px;text-align:center}
.w::placeholder{color:var(--mut)}
.row.done .n{text-decoration:line-through;color:var(--mut)}
.row.skip{opacity:.6}.row.skip .n{text-decoration:line-through}
.acts{display:flex;gap:6px;margin:-2px 0 8px}
.acts button{flex:1;padding:10px 4px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:14px}
.acts button:disabled{opacity:.35}
.acts .del{color:var(--red)}
.add,.reset{width:100%;padding:12px;margin-top:6px;border:1px dashed var(--bd);background:transparent;color:var(--ac);border-radius:12px;font-size:15px}
.reset{border-style:solid;color:var(--mut)}
.note{color:var(--mut);font-size:13px;margin:8px 2px}
#undo{display:none;position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:536px;margin:0 auto;background:#2b2b2b;color:#fff;border-radius:12px;padding:10px 14px;align-items:center;gap:10px;z-index:20}
#umsg{flex:1;font-size:14px}
#ubtn{border:0;background:transparent;color:#7fb2ff;font-size:15px;font-weight:700}
details{margin-top:14px;border:1px solid var(--bd);border-radius:12px;padding:10px 12px;background:var(--card)}summary{font-size:15px;color:var(--mut)}
#bk{width:100%;height:90px;margin:8px 0;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:12px;padding:6px}
.bb{display:flex;flex-wrap:wrap;gap:6px}.bb button,.bb label{padding:9px 12px;border:1px solid var(--bd);border-radius:8px;background:transparent;color:var(--tx);font-size:14px}
#bkmsg{font-size:13px;color:var(--ok);margin-top:6px}
</style>
</head>
<body>
<h1>workmiaout</h1>
<div class="tabs" id="tabs"></div>
<div id="main"></div>
<div id="undo"><span id="umsg"></span><button id="ubtn"></button></div>
<details><summary>💾 Respaldo (exportar / importar)</summary>
<textarea id="bk" placeholder="Acá aparece tu respaldo. Para importar, pegá el texto acá."></textarea>
<div class="bb"><button id="bkgen">Mostrar mis datos</button><button id="bkcopy">Copiar</button><button id="bkdl">Descargar archivo</button><label>Cargar archivo<input id="bkfile" type="file" accept=".json,application/json" hidden></label><button id="bkimp">Importar (reemplaza lo actual)</button></div>
<div id="bkmsg"></div></details>
<script>
var KEY="gym2";
var DEF=[["Pecho, espalda y tríceps",[["Press banca plano","4 x 6-8"],["Dominadas o jalón al pecho","4 x 8-10"],["Press inclinado con mancuernas","3 x 8-10"],["Remo con barra o mancuerna","3 x 8-10"],["Aperturas en polea o máquina","3 x 12-15"],["Press francés o extensión sobre la cabeza","3 x 10-12"],["Tríceps en polea","3 x 12-15"],["Abs: crunch en camilla con disco alta","4 x 10-15"]]],
["Piernas",[["Sentadilla","4 x 6-8"],["Prensa 45°","3 x 10-12"],["Hip thrust (banca glúteos y femorales)","3 x 8-10"],["Curl femoral","3 x 10-12"],["Extensión de cuádriceps","3 x 12-15"],["Gemelos de pie","4 x 12-15"],["Abs: elevación de piernas colgado (pelvis sube al final)","4 x 10-12"]]],
["Hombros y brazos",[["Press militar con mancuernas","4 x 8-10"],["Elevaciones laterales","4 x 12-15"],["Press inclinado con mancuernas","3 x 8-10"],["Remo al mentón o jalón agarre ancho","3 x 10-12"],["Curl con barra Z","3 x 8-10"],["Curl martillo","3 x 10-12"],["Face pull (cubre deltoides posteriores)","3 x 15"],["Abs: inclinaciones laterales con mancuerna moderada","3 x 12"]]]];
function $(i){return document.getElementById(i)}
function uid(){return "i"+Math.random().toString(36).slice(2,9)}
function h(t,p,c){var e=document.createElement(t);for(var k in p)e[k]=p[k];(c||[]).forEach(function(x){e.appendChild(typeof x==="string"?document.createTextNode(x):x)});return e}
function load(){
 try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&r.days)return r}catch(e){}
 var old={};try{old=JSON.parse(localStorage.getItem("gym")||"{}")}catch(e){}
 var S={days:[],st:{},w:{}};
 DEF.forEach(function(d,di){var day={id:"d"+di,t:d[0],e:[]};
  d[1].forEach(function(x,ei){var id="d"+di+"e"+ei,k=di+"-"+ei;day.e.push({id:id,n:x[0],s:x[1]});
   if(old[k]===true||old[k]==="x")S.st[id]=old[k];
   if(old["w"+k])S.w[id]=old["w"+k]});
  S.days.push(day)});
 return S}
var S=load(),cur=0,selEx=null,editEx=null,editDay=false,delArm=null,lpFired=false,undoStack=[],undoLeft=0,undoTimer=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function lp(el,fn,skip){var t=0,x=0,y=0;
 el.addEventListener("pointerdown",function(e){lpFired=false;if(skip&&e.target.closest(skip))return;x=e.clientX;y=e.clientY;clearTimeout(t);t=setTimeout(function(){t=0;lpFired=true;fn()},500)});
 el.addEventListener("pointermove",function(e){if(t&&(Math.abs(e.clientX-x)>10||Math.abs(e.clientY-y)>10)){clearTimeout(t);t=0}});
 ["pointerup","pointercancel","pointerleave"].forEach(function(n){el.addEventListener(n,function(){clearTimeout(t);t=0})});
 el.addEventListener("contextmenu",function(e){e.preventDefault()})}
function pushUndo(u){undoStack.push(u);undoLeft=20;clearInterval(undoTimer);
 undoTimer=setInterval(function(){undoLeft--;if(undoLeft<=0){undoStack=[];clearInterval(undoTimer)}drawUndo()},1000);drawUndo()}
function drawUndo(){var b=$("undo");if(!undoStack.length){b.style.display="none";return}
 b.style.display="flex";$("umsg").textContent=undoStack[undoStack.length-1].label;$("ubtn").textContent="Deshacer ("+undoLeft+")"}
$("ubtn").onclick=function(){var u=undoStack.pop();if(!u)return;
 if(u.type==="ex"){var di=-1;S.days.forEach(function(d,i){if(d.id===u.dayId)di=i});
  if(di<0)return;var arr=S.days[di].e;arr.splice(Math.min(u.idx,arr.length),0,u.item);cur=di}
 else{S.days.splice(Math.min(u.idx,S.days.length),0,u.day);cur=Math.min(u.idx,S.days.length-1)}
 undoLeft=20;if(!undoStack.length)clearInterval(undoTimer);save();render();drawUndo()};
document.addEventListener("click",function(e){if(delArm&&!e.target.closest(".tab.arm")){delArm=null;render()}});
function render(){
 if(cur>=S.days.length)cur=S.days.length-1;if(cur<0)cur=0;
 var tabs=$("tabs");tabs.innerHTML="";
 S.days.forEach(function(d,i){var arm=delArm===d.id;
  var t=h("div",{className:"tab"+(i===cur?" on":"")+(arm?" arm":""),textContent:arm?"🗑":"Día "+(i+1)});
  t.onclick=function(){if(lpFired){lpFired=false;return}
   if(arm){S.days.splice(i,1);pushUndo({type:"day",idx:i,day:d,label:"Día eliminado"});delArm=null;selEx=null;editEx=null;save();render()}
   else{delArm=null;cur=i;selEx=null;editEx=null;editDay=false;render()}};
  lp(t,function(){delArm=d.id;render()},null);tabs.appendChild(t)});
 var p=h("div",{className:"tab plus",textContent:"+"});
 p.onclick=function(){var nd={id:uid(),t:"",e:[]};S.days.push(nd);cur=S.days.length-1;editDay=true;selEx=null;editEx=null;save();render()};
 tabs.appendChild(p);
 var main=$("main");main.innerHTML="";
 var d=S.days[cur];
 if(!d){main.appendChild(h("div",{className:"note",textContent:"No hay días. Tocá + para agregar uno."}));return}
 var tr=h("div",{className:"trow"});
 if(editDay){var ti=h("input",{className:"ti",value:d.t,placeholder:"Nombre del día (ej: Pecho)"});
  ti.oninput=function(){d.t=ti.value;save()};
  var ok=h("button",{className:"ib",textContent:"✓"});ok.onclick=function(){editDay=false;render()};
  tr.appendChild(h("span",{className:"dn",textContent:"Día "+(cur+1)+":"}));tr.appendChild(ti);tr.appendChild(ok);setTimeout(function(){ti.focus()},50)}
 else{tr.appendChild(h("div",{className:"title",textContent:"Día "+(cur+1)+(d.t?": "+d.t:"")}));
  var pb=h("button",{className:"ib",textContent:"✏️"});pb.onclick=function(){editDay=true;render()};tr.appendChild(pb)}
 main.appendChild(tr);
 var c=0,sx=0;d.e.forEach(function(x){if(S.st[x.id]===true)c++;if(S.st[x.id]==="x")sx++});
 main.appendChild(h("div",{className:"prog",textContent:c+" de "+d.e.length+" hechos"+(sx?" · "+sx+" salteado"+(sx>1?"s":""):"")+(d.e.length&&c===d.e.length?" 🔥":"")}));
 var bi=h("i");bi.style.width=(d.e.length?c/d.e.length*100:0)+"%";main.appendChild(h("div",{className:"bar"},[bi]));
 d.e.forEach(function(x,i){
  var on=S.st[x.id]===true,sk=S.st[x.id]==="x";
  var row=h("div",{className:"row"+(on?" done":"")+(sk?" skip":"")+(selEx===x.id?" sel":"")});
  if(editEx===x.id){
   var ni=h("input",{className:"ni",value:x.n,placeholder:"Ejercicio"}),si=h("input",{className:"si",value:x.s,placeholder:"4 x 10"});
   ni.oninput=function(){x.n=ni.value;save()};si.oninput=function(){x.s=si.value;save()};
   var ok2=h("button",{className:"ib",textContent:"✓"});ok2.onclick=function(){editEx=null;render()};
   row.appendChild(h("div",{className:"top"},[ni,si,ok2]));setTimeout(function(){ni.focus()},50)}
  else{
   var cb=h("input",{type:"checkbox",checked:on});
   cb.onchange=function(){if(cb.checked)S.st[x.id]=true;else delete S.st[x.id];save();render()};
   var xb=h("button",{className:"xb"+(sk?" on":""),textContent:"✕"});xb.setAttribute("aria-label","No lo hice");
   xb.onclick=function(){if(sk)delete S.st[x.id];else S.st[x.id]="x";save();render()};
   var pen=h("button",{className:"ib",textContent:"✏️"});pen.onclick=function(){editEx=x.id;selEx=null;render()};
   row.appendChild(h("div",{className:"top"},[cb,xb,h("span",{className:"n",textContent:x.n}),pen]));
   var w=h("input",{className:"w",type:"text",inputMode:"decimal",placeholder:"kg",value:S.w[x.id]||""});
   w.oninput=function(){S.w[x.id]=w.value;save()};
   row.appendChild(h("div",{className:"bot"},[h("span",{className:"s",textContent:x.s}),w]));
   lp(row,function(){selEx=x.id;editEx=null;render()},"input,button")}
  main.appendChild(row);
  if(selEx===x.id){
   var up=h("button",{textContent:"▲ Subir",disabled:i===0}),dn=h("button",{textContent:"▼ Bajar",disabled:i===d.e.length-1}),
   del=h("button",{className:"del",textContent:"🗑 Borrar"}),fin=h("button",{textContent:"Listo"});
   up.onclick=function(){var t=d.e[i];d.e[i]=d.e[i-1];d.e[i-1]=t;save();render()};
   dn.onclick=function(){var t=d.e[i];d.e[i]=d.e[i+1];d.e[i+1]=t;save();render()};
   del.onclick=function(){d.e.splice(i,1);pushUndo({type:"ex",dayId:d.id,idx:i,item:x,label:"Ejercicio eliminado"});selEx=null;save();render()};
   fin.onclick=function(){selEx=null;render()};
   main.appendChild(h("div",{className:"acts"},[up,dn,del,fin]))}
 });
 var add=h("button",{className:"add",textContent:"+ Agregar ejercicio"});
 add.onclick=function(){var nx={id:uid(),n:"",s:"3 x 10"};d.e.push(nx);editEx=nx.id;selEx=null;save();render()};
 main.appendChild(add);
 main.appendChild(h("div",{className:"note",textContent:"Mantené apretado un ejercicio para moverlo o borrarlo. Mantené apretado un día para borrarlo."}));
 var rs=h("button",{className:"reset",textContent:"Reiniciar día (destilda, conserva los kilos)"});
 rs.onclick=function(){d.e.forEach(function(x){delete S.st[x.id]});save();render()};
 main.appendChild(rs);
}
function msg(t){$("bkmsg").textContent=t}
function bkOut(){$("bk").value=JSON.stringify(S)}
$("bkgen").onclick=function(){bkOut();msg("Listo: copialo o descargalo")};
$("bkcopy").onclick=function(){var t=$("bk");if(!t.value)bkOut();t.select();var ok=function(){msg("Copiado ✓")},no=function(){try{document.execCommand("copy");ok()}catch(e){msg("Mantené apretado el texto y copialo")}};
 try{navigator.clipboard.writeText(t.value).then(ok,no)}catch(e){no()}};
$("bkdl").onclick=function(){bkOut();var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([$("bk").value],{type:"application/json"}));a.download="workmiaout-respaldo.json";document.body.appendChild(a);a.click();a.remove();msg("Archivo descargado")};
$("bkfile").onchange=function(){var f=this.files[0];if(!f)return;var r=new FileReader();r.onload=function(){$("bk").value=r.result;msg("Archivo cargado: tocá Importar")};r.readAsText(f)};
$("bkimp").onclick=function(){try{var r=JSON.parse($("bk").value);if(!r||!r.days)throw 0;S=r;S.st=S.st||{};S.w=S.w||{};cur=0;selEx=null;editEx=null;save();render();msg("Importado ✓")}catch(e){msg("Ese texto no es un respaldo válido")}};
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
render();
</script>
</body>
</html>
